# ================================================
# Docker Compose 开发环境覆盖配置
# ================================================
# 使用方法:
#   开发环境: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile full up -d
#   生产环境: docker compose --profile full up -d
# ================================================

services:
  # ============================
  # 开发环境使用本地构建
  # ============================
  
  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    image: null  # 覆盖 image 配置，强制使用 build

  api:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    image: null

  file-service:
    build:
      context: .
      dockerfile: docker/file-service.Dockerfile
    image: null
    volumes:
      # 开发环境使用本地配置文件（可直接修改调试）
      - ./services/file-service/etc/file-api.yaml:/app/etc/file-api.yaml:ro
      - file_data:/app/data

  # ============================
  # 开发环境特殊配置
  # ============================
  
  init:
    # 开发环境保持本地构建
    build:
      context: ./backend
      dockerfile: ../docker/init.Dockerfile

