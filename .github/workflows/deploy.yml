# ================================================
# ClayMo 生产部署 - 单服务器自动部署
# ================================================
# 功能：
#   1. 等待所有镜像构建完成
#   2. SSH 到服务器拉取最新镜像
#   3. 执行数据库迁移
#   4. 滚动更新服务
#   5. 健康检查
#   6. 失败自动回滚
# ================================================
name: Deploy to Production

on:
  workflow_run:
    workflows: ["Backend CI/CD", "Frontend CI", "File Service CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migration:
        description: '跳过数据库迁移'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ========================================
  # 检查前置条件
  # ========================================
  check-prerequisites:
    name: 检查部署条件
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    
    steps:
      - name: 检查 workflow 状态
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ 手动触发部署"
          elif [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ CI 构建成功，准备部署"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "❌ CI 构建失败，跳过部署"
          fi

  # ========================================
  # 备份数据库
  # ========================================
  backup-database:
    name: 备份数据库
    runs-on: ubuntu-latest
    needs: check-prerequisites
    if: needs.check-prerequisites.outputs.should_deploy == 'true'
    
    steps:
      - name: SSH 连接并备份数据库
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            echo "📦 开始备份数据库..."
            cd ${{ secrets.PRODUCTION_PATH }}
            
            # 创建备份目录
            mkdir -p backups
            
            # 备份数据库
            BACKUP_FILE="backups/db-backup-$(date +%Y%m%d-%H%M%S).sql"
            docker exec claymo-mysql mysqldump -u root -p${{ secrets.MYSQL_ROOT_PASSWORD }} \
              --all-databases --single-transaction --quick --lock-tables=false \
              > $BACKUP_FILE
            
            # 压缩备份
            gzip $BACKUP_FILE
            
            # 只保留最近 7 天的备份
            find backups/ -name "db-backup-*.sql.gz" -mtime +7 -delete
            
            echo "✅ 数据库备份完成: ${BACKUP_FILE}.gz"

  # ========================================
  # 数据库迁移
  # ========================================
  migrate-database:
    name: 数据库迁移
    runs-on: ubuntu-latest
    needs: backup-database
    if: ${{ !inputs.skip_migration }}
    
    steps:
      - name: SSH 连接并执行迁移
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            echo "🔄 开始数据库迁移..."
            cd ${{ secrets.PRODUCTION_PATH }}
            
            # 拉取最新的 CLI 工具镜像
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-cli:latest
            
            # 执行 Host 数据库迁移
            docker run --rm --network claymo_claymo-network \
              -e SqlSugar__ConnectionStrings__Default="Server=mysql;Port=3306;Database=claymo_host;Uid=root;Password=${{ secrets.MYSQL_ROOT_PASSWORD }};Charset=utf8mb4" \
              -e Redis__Configuration="redis:6379" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-cli:latest \
              dotnet ClayMo.Tools.Platform.dll migrate host --ensure-db true
            
            # 执行租户数据库迁移（仅 Ready 状态）
            docker run --rm --network claymo_claymo-network \
              -e SqlSugar__ConnectionStrings__Default="Server=mysql;Port=3306;Database=claymo_host;Uid=root;Password=${{ secrets.MYSQL_ROOT_PASSWORD }};Charset=utf8mb4" \
              -e Redis__Configuration="redis:6379" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-cli:latest \
              dotnet ClayMo.Tools.Platform.dll migrate tenants --only-ready true --parallel 1
            
            echo "✅ 数据库迁移完成"

  # ========================================
  # 部署服务
  # ========================================
  deploy:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: [backup-database, migrate-database]
    if: |
      always() && 
      needs.backup-database.result == 'success' &&
      (needs.migrate-database.result == 'success' || needs.migrate-database.result == 'skipped')
    
    steps:
      - name: SSH 连接并部署
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 10
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            echo "🚀 开始部署服务..."
            cd ${{ secrets.PRODUCTION_PATH }}
            
            # 拉取最新镜像
            echo "📥 拉取最新 Docker 镜像..."
            docker compose --profile full pull
            
            # 滚动更新服务（保持零停机）
            echo "🔄 更新 Gateway..."
            docker compose up -d --no-deps gateway
            
            echo "⏳ 等待 Gateway 启动..."
            sleep 10
            
            echo "🔄 更新 API 服务..."
            docker compose up -d --no-deps api
            
            echo "⏳ 等待 API 启动..."
            sleep 15
            
            echo "🔄 更新文件服务..."
            docker compose up -d --no-deps file-service
            
            echo "⏳ 等待文件服务启动..."
            sleep 10
            
            # 清理旧镜像和容器
            echo "🧹 清理旧镜像..."
            docker image prune -f --filter "until=168h"
            
            echo "✅ 服务部署完成"

  # ========================================
  # 健康检查
  # ========================================
  health-check:
    name: 健康检查
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: 等待服务稳定
        run: sleep 20
      
      - name: 检查 Gateway 健康状态
        run: |
          echo "🔍 检查 Gateway..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            http://${{ secrets.PRODUCTION_HOST }}:5080/health)
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Gateway 健康检查通过 (HTTP $RESPONSE)"
          else
            echo "❌ Gateway 健康检查失败 (HTTP $RESPONSE)"
            exit 1
          fi
      
      - name: 检查 API Swagger
        run: |
          echo "🔍 检查 API Swagger..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            http://${{ secrets.PRODUCTION_HOST }}:5080/api/swagger/index.html)
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ API 健康检查通过 (HTTP $RESPONSE)"
          else
            echo "❌ API 健康检查失败 (HTTP $RESPONSE)"
            exit 1
          fi
      
      - name: SSH 检查容器状态
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            echo "🔍 检查容器状态..."
            cd ${{ secrets.PRODUCTION_PATH }}
            
            # 检查所有服务是否正常运行
            docker compose ps --format json | jq -r '.[] | "\(.Service): \(.State)"'
            
            # 检查是否有异常退出的容器
            UNHEALTHY=$(docker compose ps --filter "status=exited" --format json | jq -s 'length')
            
            if [ "$UNHEALTHY" -gt 0 ]; then
              echo "❌ 发现 $UNHEALTHY 个异常容器"
              docker compose ps
              exit 1
            else
              echo "✅ 所有容器运行正常"
            fi

  # ========================================
  # 部署通知
  # ========================================
  notify:
    name: 发送部署通知
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
    if: always()
    
    steps:
      - name: 生成部署报告
        id: report
        run: |
          if [[ "${{ needs.health-check.result }}" == "success" ]]; then
            echo "status=✅ 部署成功" >> $GITHUB_OUTPUT
            echo "color=#36a64f" >> $GITHUB_OUTPUT
          else
            echo "status=❌ 部署失败" >> $GITHUB_OUTPUT
            echo "color=#ff0000" >> $GITHUB_OUTPUT
          fi
          
          echo "commit_msg=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT
      
      # 可以集成 Slack、钉钉、企业微信等通知
      - name: 输出部署结果
        run: |
          echo "================================================"
          echo "${{ steps.report.outputs.status }}"
          echo "================================================"
          echo "分支: ${{ github.ref_name }}"
          echo "提交: ${{ github.sha }}"
          echo "提交者: ${{ github.actor }}"
          echo "时间: $(date)"
          echo "================================================"

  # ========================================
  # 回滚（健康检查失败时）
  # ========================================
  rollback:
    name: 自动回滚
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
    if: failure() && needs.deploy.result == 'success'
    
    steps:
      - name: SSH 连接并回滚
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            echo "⚠️ 检测到部署失败，开始回滚..."
            cd ${{ secrets.PRODUCTION_PATH }}
            
            # 查看日志
            echo "📋 最近的错误日志："
            docker compose logs --tail=50 gateway api file-service
            
            # 回滚到上一个版本的镜像
            # 注意：这里需要你在环境变量中维护上一个稳定版本
            # 或者使用 docker tag 策略保留上一个版本
            
            echo "❌ 回滚流程需要手动介入"
            echo "请检查日志并手动恢复服务"

