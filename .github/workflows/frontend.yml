name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/frontend.yml'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Type check
        run: pnpm type-check
        continue-on-error: true

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Build Web
        run: pnpm build

      - name: Build Admin
        run: pnpm build:admin

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/web/dist
          retention-days: 7

      - name: Upload Admin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: frontend/admin/dist
          retention-days: 7

  # ========================================
  # Docker 构建测试
  # ========================================
  # 注意：前端静态文件由 Gateway 统一构建和管理
  # 此 job 用于测试 Gateway Docker 镜像构建（包含前端）
  docker-build:
    name: Gateway Docker Build Test (with Frontend)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/gateway/Dockerfile
          push: false
          tags: claymo-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max








