# ================================================
# ClayMo File Service CI - Go + go-zero
# ================================================
name: File Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/file-service/**'
      - 'packages/libs/go-common/**'
      - '.github/workflows/file-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/file-service/**'
      - 'packages/libs/go-common/**'
      - '.github/workflows/file-service.yml'

env:
  GO_VERSION: '1.24'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/file-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/file-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
        continue-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: services/file-service/coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/file-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/file-service/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: services/file-service
          args: --timeout=5m
        continue-on-error: true

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/file-service/Dockerfile
          push: false
          tags: claymo-file-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max








