name: Init Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/tools/**'
      - 'backend/framework/**'
      - 'backend/modules/**'
      - '.github/workflows/init-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/tools/**'
      - 'backend/framework/**'
      - 'backend/modules/**'
      - '.github/workflows/init-service.yml'

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REGISTRY: ghcr.io

jobs:
  # ========================================
  # Docker 构建测试（PR 时不推送）
  # ========================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/tools/ClayMo.Tools.Platform/Dockerfile
          push: false
          tags: claymo-init:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # Docker 构建并推送到 GHCR
  # ========================================
  docker-build-and-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: echo "REPOSITORY_OWNER_LOWERCASE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY_OWNER_LOWERCASE }}/claymo-init
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/tools/ClayMo.Tools.Platform/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

