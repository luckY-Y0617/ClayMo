Name: file-service
Host: 0.0.0.0
Port: 8889

# ========== 认证配置 ==========
Auth:
  AccessSecret: ${FILE_SERVICE_JWT_SECRET}
  AccessExpire: 7200

# ========== 数据库配置 ==========
DB:
  # 格式：user:password@tcp(host:port)/database?params
  DataSource: "${MYSQL_USER:root}:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST:mysql}:${MYSQL_PORT:3306})/${MYSQL_DATABASE:claymo_host}?charset=utf8mb4&parseTime=true&loc=Local"

# ========== Redis 配置 ==========
Redis:
  Host: "${REDIS_HOST:redis}:${REDIS_PORT:6379}"
  Type: "node"
  Pass: ${REDIS_PASSWORD:}

# ========== 缓存配置 ==========
Cache:
  - Host: "${REDIS_HOST:redis}:${REDIS_PORT:6379}"
    Type: "node"
    Pass: ${REDIS_PASSWORD:}

# ========== 对象存储配置 ==========

Storage:
  Provider: ${STORAGE_PROVIDER:obs}
  Region: ${STORAGE_REGION:cn-east-3}
  Endpoint: ${STORAGE_ENDPOINT}
  AccessKey: ${STORAGE_ACCESS_KEY}
  SecretKey: ${STORAGE_SECRET_KEY}
  Bucket: ${STORAGE_BUCKET}
  UsePathStyle: true
  PresignPutExpireSeconds: 900
  PresignGetExpireSeconds: 300

# ========== 上传策略配置 ==========
UploadPolicy:
  AutoMultipartThresholdBytes: 10485760  # 10MB
  MinPartSizeBytes: 5242880              # 5MB
  MaxParts: 10000

# ========== 内部服务认证配置 ==========
Internal:
  HmacSecret: ${INTERNAL_HMAC_SECRET}
  AllowClockSkewSeconds: 60

# ========== Kafka 配置 ==========
Kafka:
  Brokers:
    - "${KAFKA_HOST:kafka}:${KAFKA_PORT:9092}"
  TopicTranscode: "file-transcode-tasks"
  TopicOutbox: "file-outbox-events"

# ========== CORS 配置 ==========
CORS:
  AllowedOrigins:
    - ${CORS_ORIGIN_0:*}
  AllowedMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  AllowedHeaders:
    - Content-Type
    - Authorization
    - __tenant
    - X-Upload-Token
