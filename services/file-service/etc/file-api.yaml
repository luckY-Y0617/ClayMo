Name: file-service
Host: 0.0.0.0
Port: 8889

# ========== 认证配置 ==========
Auth:
  AccessSecret: ""
  AccessExpire: 7200

# ========== 数据库配置 ==========
DB:
  # 格式：user:password@tcp(host:port)/database?params
  DataSource: "root:@tcp(mysql:3306)/claymo_host?charset=utf8mb4&parseTime=true&loc=Local"

# ========== Redis 配置 ==========
Redis:
  Host: "redis:6379"
  Type: "node"
  Pass: ""

# ========== 缓存配置 ==========
Cache:
  - Host: "redis:6379"
    Type: "node"
    Pass: ""

# ========== 对象存储配置 ==========

Storage:
  Provider: "obs"
  Region: "cn-east-3"
  Endpoint: ""
  AccessKey: ""
  SecretKey: ""
  Bucket: ""
  UsePathStyle: true
  PresignPutExpireSeconds: 900
  PresignGetExpireSeconds: 300

# ========== 上传策略配置 ==========
UploadPolicy:
  AutoMultipartThresholdBytes: 10485760  # 10MB
  MinPartSizeBytes: 5242880              # 5MB
  MaxParts: 10000

# ========== 内部服务认证配置 ==========
Internal:
  HmacSecret: ""
  AllowClockSkewSeconds: 60

# ========== Kafka 配置 ==========
Kafka:
  Brokers:
    - "kafka:9092"
  TopicTranscode: "file-transcode-tasks"
  TopicOutbox: "file-outbox-events"

# ========== CORS 配置 ==========
CORS:
  AllowedOrigins:
    - "*"
  AllowedMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  AllowedHeaders:
    - Content-Type
    - Authorization
    - __tenant
    - X-Upload-Token
