# ================================================
# ClayMo Docker Compose
# ================================================
# 使用方法:
#   一键启动全部:   docker compose --profile full up -d
#   仅基础设施:     docker compose up -d mysql redis
#   查看日志:       docker compose logs -f [service]
#   停止服务:       docker compose down
#   清理数据:       docker compose down -v
#
# 启动流程 (--profile full):
#   1. mysql/redis 启动并健康检查
#   2. init 服务执行 migrate + seed 后退出
#   3. api/file-service 启动
#   4. gateway 启动（统一入口，包含前端静态文件）
#
# 子域名路由架构 (Gateway 按 Host 头分发):
#   admin.claymo.local:5080 → 后台管理前端
#   claymo.local:5080       → 前台前端
#   /api/*                  → API 服务 (反向代理)
#   /fs/*                   → 文件服务 (反向代理)
#
# 配置方式：
#   生产环境：在项目根目录创建 .env 文件覆盖默认值
#   开发环境：使用默认值 + appsettings.Development.json
# ================================================

name: claymo

services:
  # ============================
  # 基础设施
  # ============================
  
  mysql:
    image: mysql:8.0
    container_name: claymo-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-claymo_host}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - claymo-network

  redis:
    image: redis:7-alpine
    container_name: claymo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - claymo-network

  # Kafka (消息队列 - 文件服务异步处理)
  # 使用 Confluent KRaft 模式（无需 Zookeeper）
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: claymo-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - claymo-network
    profiles:
      - full

  # ============================
  # 初始化服务 (migrate + seed)
  # ============================

  init:
    image: ${INIT_IMAGE:-ghcr.io/lucky-y0617/claymo-init:latest}
    # build:
    #   context: ./backend
    #   dockerfile: tools/ClayMo.Tools.Platform/Dockerfile
    container_name: claymo-init
    environment:
      SqlSugar__ConnectionStrings__Default: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-claymo_host};Uid=root;Password=${MYSQL_ROOT_PASSWORD:-123456};Charset=utf8mb4"
      Redis__Configuration: "redis:6379${REDIS_PASSWORD:+,password=${REDIS_PASSWORD}}"
    entrypoint: ["/bin/sh", "-c"]
    command: ["dotnet ClayMo.Tools.Platform.dll migrate host && dotnet ClayMo.Tools.Platform.dll seed host"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - claymo-network
    profiles:
      - full

  # ============================
  # 应用服务
  # ============================

  gateway:
    # 生产环境：使用 GHCR 镜像（通过 CI/CD 推送）
    # 开发环境：使用本地构建（注释掉 image，取消注释 build）
    image: ${GATEWAY_IMAGE:-ghcr.io/lucky-y0617/claymo-gateway:latest}
    # build:
    #   context: .
    #   dockerfile: services/gateway/Dockerfile
    container_name: claymo-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-5080}:5080"
      - "${GATEWAY_HTTPS_PORT:-5443}:5443"
    volumes:
      # 证书目录（如果没有证书文件，只使用 HTTP）
      - ${CERT_PATH:-./infra/cert}:/app/cert:ro
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:5080}
      # 子域名配置
      Domains__AdminPrefix: ${ADMIN_PREFIX:-admin.}
      # CORS 配置（生产环境建议配置具体域名，开发环境使用 *）
      Cors__Origins__0: ${CORS_ORIGIN_0:-*}
      Cors__Origins__1: ${CORS_ORIGIN_1:-}
      Cors__Origins__2: ${CORS_ORIGIN_2:-}
      # 反向代理配置（指向容器服务名）
      ReverseProxy__Clusters__api-cluster__Destinations__api-service__Address: http://api:19001
      ReverseProxy__Clusters__file-cluster__Destinations__file-service__Address: http://file-service:8889
      # HTTPS 证书配置（可选，配置后自动启用 HTTPS）
      Kestrel__Endpoints__Https__Url: ${HTTPS_URL:-}
      Kestrel__Endpoints__Https__Certificate__Path: ${CERT_FILE:-}
      Kestrel__Endpoints__Https__Certificate__KeyPath: ${CERT_KEY_FILE:-}
    depends_on:
      api:
        condition: service_healthy
      file-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - claymo-network
    profiles:
      - full

  api:
    # 生产环境：使用 GHCR 镜像（通过 CI/CD 推送）
    # 开发环境：使用本地构建（注释掉 image，取消注释 build）
    image: ${API_IMAGE:-ghcr.io/lucky-y0617/claymo-backend:latest}
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    container_name: claymo-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-19001}:19001"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:19001
      # 数据库配置
      SqlSugar__ConnectionStrings__Default: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-claymo_host};Uid=root;Password=${MYSQL_ROOT_PASSWORD:-123456}"
      # Redis 配置
      Redis__Configuration: "redis:6379${REDIS_PASSWORD:+,password=${REDIS_PASSWORD}}"
      # 认证配置（必须与 appsettings.json 中的 Authentication 配置节对应）
      Authentication__Jwt__SigningKey: ${JWT_SECRET_KEY:-DevSecretKeyAtLeast32CharactersLong!}
      Authentication__Jwt__Issuer: ${JWT_ISSUER:-ClayMo}
      Authentication__Jwt__Audience: ${JWT_AUDIENCE:-ClayMo}
      # 文件服务配置（云存储）
      FileService__HuaWeiYun__EndPoint: ${FILE_SERVICE_ENDPOINT:-}
      FileService__HuaWeiYun__AccessKeyId: ${FILE_SERVICE_ACCESS_KEY:-}
      FileService__HuaWeiYun__SecretAccessKey: ${FILE_SERVICE_SECRET_KEY:-}
      FileService__HuaWeiYun__BucketName: ${FILE_SERVICE_BUCKET:-}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:19001/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - claymo-network
    profiles:
      - full

  file-service:
    # 生产环境：使用 GHCR 镜像（通过 CI/CD 推送）
    # 开发环境：使用本地构建（注释掉 image，取消注释 build）
    image: ${FILE_SERVICE_IMAGE:-ghcr.io/lucky-y0617/claymo-file-service:latest}
    # build:
    #   context: .
    #   dockerfile: services/file-service/Dockerfile
    container_name: claymo-file-service
    restart: unless-stopped
    ports:
      - "${FILE_SERVICE_PORT:-8889}:8889"
    environment:
      # 文件服务配置
      # 根据 file-service 的具体实现添加必要的环境变量
      # 例如：数据库、Redis、Kafka 等配置
      KAFKA_SERVERS: kafka:9092
    volumes:
      - ./services/file-service/etc/file-api.yaml:/app/etc/file-api.yaml:ro
      - file_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - claymo-network
    profiles:
      - full

# ============================
# 网络
# ============================
networks:
  claymo-network:
    driver: bridge

# ============================
# 数据卷
# ============================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  file_data:
    driver: local

